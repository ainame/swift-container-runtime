name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: swift:6.4.1
      # Namespace, procfs, mount, and mknod integration tests require privileges.
      # The host cgroup namespace shows the runner VM's own root, where systemd
      # already enables memory and pids; a private namespace's root would be
      # this container's cgroup, which holds the job's processes and so cannot
      # enable controllers for children (cgroup v2 no-internal-processes rule).
      options: --privileged --cgroupns=host
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.4.1 '
      - name: Install OCI fixtures
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq busybox-static runc libseccomp-dev
      - name: Unit tests with strict memory diagnostics
        run: swift test --disable-automatic-resolution
      - name: Debug integration suites
        run: sh scripts/run-integration.sh .build/debug/srunc
      - name: Optimized unit and integration tests
        run: |
          swift test -c release --disable-automatic-resolution
          sh scripts/run-integration.sh .build/release/srunc

  docker:
    # x86_64 engine profile on the hosted runner: its Docker, AppArmor and
    # kernel, with the daemon switched to the cgroupfs driver this runtime
    # manages. The runtime is built for the runner's Ubuntu 24.04 glibc.
    runs-on: ubuntu-24.04
    env:
      IMAGE: alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime for the runner
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace swift:6.4.1-noble /bin/sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libseccomp-dev > /dev/null
            swift build -c release --static-swift-stdlib --product srunc --scratch-path .build/noble'
          sudo install -m 755 .build/noble/release/srunc /usr/local/bin/srunc
      - name: Register the runtime with Docker
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq busybox-static libseccomp2 jq
          config=/etc/docker/daemon.json
          [ -f "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"exec-opts": ["native.cgroupdriver=cgroupfs"],
                        "runtimes": ((.runtimes // {}) + {"swift": {"path": "/usr/local/bin/srunc"}})}' \
            "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          uname -srm
          docker info --format '{{.ServerVersion}} {{.CgroupDriver}} {{.SecurityOptions}}'
          docker pull -q "$IMAGE"
      - name: Docker acceptance gate
        run: |
          sudo sh scripts/docker-integration.sh runc "$IMAGE"
          sudo sh scripts/docker-integration.sh swift "$IMAGE"
      - name: AppArmor confinement gate
        run: sudo sh scripts/apparmor-integration.sh /usr/local/bin/srunc

  runtime-tools:
    name: OCI runtime-tools validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: swift:6.4.1
      # The pinned suite creates namespaces, mounts and device nodes. It uses
      # a private state root and the host's delegated cgroup v2 hierarchy.
      options: --privileged --cgroupns=host
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            golang-go make perl python3 git busybox-static libseccomp-dev apparmor
          swift --version
          swift --version | grep -q 'Swift version 6.4.1 '
      - name: Build srunc with strict memory safety
        run: swift build --disable-automatic-resolution --product srunc
      - name: Check the TAP harness
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-runtime-tools-runner.py
      - name: Build the pinned upstream suite
        run: sh scripts/prepare-runtime-tools.sh .build/runtime-tools-upstream
      - name: Prepare the upstream AppArmor profile when available
        run: |
          if grep -q '^Y' /sys/module/apparmor/parameters/enabled 2>/dev/null; then
            mountpoint -q /sys/kernel/security || mount -t securityfs securityfs /sys/kernel/security
            cat > .build/runtime-tools-apparmor <<'PROFILE'
          profile acme_secure_profile flags=(attach_disconnected,mediate_deleted) {
            file, capability, network, unix, signal, ptrace, mount, umount, pivot_root, dbus,
          }
          PROFILE
            apparmor_parser -r .build/runtime-tools-apparmor
          fi
      - name: Run applicable OCI validation executables
        # The job container's /tmp is overlayfs, which rejects the char 0:0
        # nodes masked/read-only path suites create; the workspace is a host
        # bind mount.
        run: |
          mkdir -p .build/runtime-tools-tmp
          TMPDIR="$PWD/.build/runtime-tools-tmp" python3 scripts/runtime-tools-integration.py .build/debug/srunc .build/runtime-tools-upstream .build/runtime-tools-results
      - name: Remove the test AppArmor profile
        if: always()
        run: |
          if [ -f .build/runtime-tools-apparmor ]; then
            apparmor_parser -R .build/runtime-tools-apparmor
          fi
      - name: Preserve results, raw TAP and exclusion reasons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-tools-validation
          path: .build/runtime-tools-results/
          if-no-files-found: warn
