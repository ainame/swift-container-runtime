name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual dispatch runs the complete debug and release integration matrix
  # (docs/testing.md validation tiers); pushes and pull requests run release
  # integration only.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
# The event is part of the key so pushes never cancel a manual full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.configuration }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    container:
      image: swift:6.4.1-resolute
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.4.1 '
      - name: Install libseccomp headers
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libseccomp-dev
      - name: Unit tests with strict memory diagnostics
        run: swift test -c ${{ matrix.configuration }} --disable-automatic-resolution

  integration:
    # Suites are independent and each job gets a fresh runner VM, so the
    # inventory is split into shards (scripts/run-integration.sh --list-shards).
    name: integration (${{ matrix.configuration }}, ${{ matrix.shard }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["debug","release"]' || '["release"]') }}
        shard: [cpu, cgroup, controllers, rest]
    container:
      image: swift:6.4.1-resolute
      # Namespace, procfs, mount, and mknod integration tests require privileges.
      # The host cgroup namespace shows the runner VM's own root, where systemd
      # already enables memory and pids; a private namespace's root would be
      # this container's cgroup, which holds the job's processes and so cannot
      # enable controllers for children (cgroup v2 no-internal-processes rule).
      options: --privileged --cgroupns=host
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          swift --version
          swift --version | grep -q 'Swift version 6.4.1 '
      - name: Install OCI fixtures
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq busybox-static runc libseccomp-dev uidmap
      - name: Build srunc with strict memory safety
        run: swift build -c ${{ matrix.configuration }} --disable-automatic-resolution --product srunc
      - name: Allow unprivileged user namespaces for the rootless suite
        # Ubuntu's AppArmor denies unconfined unprivileged processes a
        # usable user namespace; rootless-integration.sh runs as uid 1000.
        # The privileged job container shares the disposable runner VM's
        # sysctls, so this lasts only for the job.
        run: |
          restrict=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$restrict" ]; then echo 0 > "$restrict"; fi
      - name: Integration suites
        run: sh scripts/run-integration.sh .build/${{ matrix.configuration }}/srunc --shard ${{ matrix.shard }}

  docker:
    # x86_64 engine profile on the hosted runner: its Docker, AppArmor and
    # kernel, gated first with the daemon switched to the cgroupfs driver,
    # then with its systemd driver (transient scopes through systemd's
    # private D-Bus socket). The runtime is built for the runner's Ubuntu
    # 26.04 glibc.
    runs-on: ubuntu-26.04
    env:
      IMAGE: alpine@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime for the runner
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace swift:6.4.1-resolute /bin/sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libseccomp-dev > /dev/null
            swift build -c release --static-swift-stdlib --product srunc --scratch-path .build/resolute'
          sudo install -m 755 .build/resolute/release/srunc /usr/local/bin/srunc
      - name: Register the runtime with Docker
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq busybox-static libseccomp2 jq python3
          config=/etc/docker/daemon.json
          [ -f "$config" ] || echo '{}' | sudo tee "$config" > /dev/null
          sudo jq '. + {"exec-opts": ["native.cgroupdriver=cgroupfs"],
                        "runtimes": ((.runtimes // {}) + {"swift": {"path": "/usr/local/bin/srunc"}})}' \
            "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          uname -srm
          docker info --format '{{.ServerVersion}} {{.CgroupDriver}} {{.SecurityOptions}}'
          docker pull -q "$IMAGE"
      - name: Docker acceptance gate
        run: |
          sudo sh scripts/docker-integration.sh runc "$IMAGE"
          sudo sh scripts/docker-integration.sh swift "$IMAGE"
      - name: Containerd exec races and backpressure
        run: sudo sh scripts/containerd-integration.sh /usr/local/bin/srunc /run/containerd/containerd.sock
      - name: AppArmor confinement gate
        run: sudo sh scripts/apparmor-integration.sh /usr/local/bin/srunc
      - name: Switch Docker to the systemd cgroup driver
        run: |
          config=/etc/docker/daemon.json
          sudo jq '.["exec-opts"] = ["native.cgroupdriver=systemd"]' "$config" | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format '{{.ServerVersion}} {{.CgroupDriver}}'
          systemctl --version | head -1
      - name: Docker acceptance gate with the systemd driver
        run: |
          sudo sh scripts/docker-integration.sh runc "$IMAGE"
          sudo sh scripts/docker-integration.sh swift "$IMAGE"

  runtime-tools:
    name: OCI runtime-tools validation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: swift:6.4.1-resolute
      # The pinned suite creates namespaces, mounts and device nodes. It uses
      # a private state root and the host's delegated cgroup v2 hierarchy.
      options: --privileged --cgroupns=host
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            golang-go make perl python3 git busybox-static libseccomp-dev apparmor
          swift --version
          swift --version | grep -q 'Swift version 6.4.1 '
      - name: Build srunc with strict memory safety
        run: swift build --disable-automatic-resolution --product srunc
      - name: Check the TAP harness
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-runtime-tools-runner.py
      - name: Build the pinned upstream suite
        run: sh scripts/prepare-runtime-tools.sh .build/runtime-tools-upstream
      - name: Prepare the upstream AppArmor profile when available
        run: |
          if grep -q '^Y' /sys/module/apparmor/parameters/enabled 2>/dev/null; then
            mountpoint -q /sys/kernel/security || mount -t securityfs securityfs /sys/kernel/security
            cat > .build/runtime-tools-apparmor <<'PROFILE'
          profile acme_secure_profile flags=(attach_disconnected,mediate_deleted) {
            file, capability, network, unix, signal, ptrace, mount, umount, pivot_root, dbus,
          }
          PROFILE
            apparmor_parser -r .build/runtime-tools-apparmor
          fi
      - name: Run applicable OCI validation executables
        # The job container's /tmp is overlayfs, which rejects the char 0:0
        # nodes masked/read-only path suites create; the workspace is a host
        # bind mount.
        run: |
          mkdir -p .build/runtime-tools-tmp
          TMPDIR="$PWD/.build/runtime-tools-tmp" python3 scripts/runtime-tools-integration.py .build/debug/srunc .build/runtime-tools-upstream .build/runtime-tools-results
      - name: Remove the test AppArmor profile
        if: always()
        run: |
          if [ -f .build/runtime-tools-apparmor ]; then
            apparmor_parser -R .build/runtime-tools-apparmor
          fi
      - name: Preserve results, raw TAP and exclusion reasons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-tools-validation
          path: .build/runtime-tools-results/
          if-no-files-found: warn
